apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  values:
    prometheus:
      prometheusSpec:
        nodeSelector:
          storage: ssd
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: "1"
            memory: 2Gi
    grafana:
      resources:
        requests:
          cpu: 200m
          memory: 192Mi
        limits:
          cpu: "1"
          memory: 384Mi
      startupProbe:
        httpGet:
          path: /api/health
          port: grafana
        periodSeconds: 10
        failureThreshold: 30
      nodeSelector:
        storage: ssd
    alertmanager:
      alertmanagerSpec:
        nodeSelector:
          storage: ssd
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 256Mi
    prometheusOperator:
      nodeSelector:
        storage: ssd
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 256Mi
    kube-state-metrics:
      nodeSelector:
        storage: ssd
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 256Mi
